name: Build and Push Images

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all variants
        run: |
          COLORS="blue green yellow orange purple red"
          VARIANTS="good bad slow"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          for COLOR in $COLORS; do
            for VARIANT in $VARIANTS; do
              case $VARIANT in
                bad)  EXTRA_ARGS="--build-arg ERROR_RATE=15"; TAG="bad-${COLOR}" ;;
                slow) EXTRA_ARGS="--build-arg LATENCY=2";     TAG="slow-${COLOR}" ;;
                *)    EXTRA_ARGS="";                          TAG="${COLOR}" ;;
              esac
              docker buildx build --platform linux/amd64,linux/arm64 --push \
                --build-arg "COLOR=${COLOR}" ${EXTRA_ARGS} \
                --tag "${IMAGE}:${TAG}" \
                --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
                --label "org.opencontainers.image.description=Argo Rollouts Demo (${TAG})" \
                --label "org.opencontainers.image.licenses=Apache-2.0" .
            done
          done
